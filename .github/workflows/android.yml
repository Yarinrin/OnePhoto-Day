# Builds the installable Android app.
#
# This runs on GitHub rather than anywhere else for one concrete reason: the
# Android SDK and the Android Gradle Plugin are served from dl.google.com, and
# the sandbox this app was developed in blocks that host outright. GitHub's
# runners already have the SDK installed and can reach it, so the APK is built
# where the tools actually are.
#
# The result is attached to the run as an artifact, and — when the run is for a
# tag — to a GitHub Release, which is the version you can hand someone a link to.

name: Android APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      # Copies dist/ into the native project and regenerates the plugin glue.
      # Both are gitignored, so this is what makes the checkout buildable.
      - name: Sync the native project
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect it
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/one-photo-day.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: one-photo-day-apk-${{ github.sha }}
          path: out/one-photo-day.apk
          if-no-files-found: error

      # A release, not just an artifact, because an artifact is a zip that only
      # a signed-in GitHub user can fetch — no use at all on a phone. A release
      # asset is a plain link you can open in the phone's browser.
      #
      # Tagged builds get their own release; every other build overwrites the
      # rolling `android-latest` one, so there is always exactly one link that
      # means "the current app".
      - name: Publish it
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'android-latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Latest Android build' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            **one-photo-day.apk** — built from `${{ github.sha }}`.

            Open this page on an Android phone, download the APK and tap it.
            Android will ask permission to install apps from wherever you
            downloaded it; that is what sideloading is, and it is the only way
            to install an app that isn't on the Play Store.

            "Try the demo" works with no account and no connection.
          files: out/one-photo-day.apk
